  essentialsc.speed.reset:
    description: Reset speed to default
    default: op

  essentialsc.speed.walk:
    description: Change walk speed
    default: op

  essentialsc.speed.fly:
    description: Change fly speed
    default: op

  essentialsc.rename.bypass:
    description: bypass rename config options
    default: op

  essentialsc.repair.others:
    default: op
    description: Allow repairing other players items

  essentialsc.nick.others:
    default: op
    description: Allow setting others' nicknames

  essentialsc.nick.reset:
    default: op
    description: Allow resetting/removing others' nicknames

  essentialsc.playtime.others:
    description: Allows checking other players playtime
    default: op

  essentialsc.shop.admin:
    default: op
    description: Allow reloading shop configuration

  essentialsc.shop.bypass:
    default: op
    description: Bypass shop restrictions

  essentialsc.hat:
    description: Allows using /hat command
    default: true

  essentialsc.hat.blocks:
    description: Allows wearing blocks as hats (when blocked in config)
    default: op

  essentialsc.hat.binding_bypass:
    description: Allows replacing helmets with curse of binding
    default: op

  essentialsc.sudo:
    description: Allows using /sudo
