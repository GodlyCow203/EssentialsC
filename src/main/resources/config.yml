debug: true

default-language: en_US

heal:
  feed-player: true
  clear-negative-effects: true

economy:
  enabled: true
  starting-balance: "100.00"
  currency:
    singular: "Dollar"
    plural: "Dollars"
  minimum-transaction: "0.01"
  max-balance: -1

teleport:
  tpa:
    cooldown: 60
    warmup: 3
    timeout: 60
    max-pending: 5
    max-outgoing: 1
    cost: 0.0
    deny-movement: true
    particles: true
    sounds: true
    blocked-worlds: []

home:
  max-homes: 3
  default-name: "home"
  cooldown: 5
  warmup: 3
  cancel-on-movement: true
  particles: true
  sounds: true
  blocked-worlds:
    - "world_nether"
    - "world_the_end"

spawn:
  cooldown: 5
  warmup: 3
  teleport-on-first-join: true
  particles: true
  sounds: true
  cancel-on-movement: true