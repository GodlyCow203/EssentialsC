name: EssentialsC-MySQLExpansion
version: '${project.version}'
main: net.godlycow.org.essc.expansion.mysql.MySQLDatabaseExpansion
api-version: "1.20"
authors: [_GodlyCow]
description: Cross-server economy sync expansion for EssentialsC using MySQL.
website: https://wiki.godlycow.org/essc/expansions/landingpage

depend:
  - EssentialsC

softdepend: []

commands:
  mysqlsync:
    description: MySQL sync admin commands
    usage: /mysqlsync <status|forcepush|forcepull|reload>
    permission: esscmysql.admin

permissions:
  esscmysql.admin:
    description: Access to /mysqlsync commands
    default: op