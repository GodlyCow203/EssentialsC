name: EssentialsC-MySQLExpansion
version: '${project.version}'
main: net.godlycow.org.essc.expansion.mysql.MySQLExpansion
api-version: "1.20"
authors: [_GodlyCow]
description: Cross-server network synchronization expansion for EssentialsC backed by MySQL

depend:
  - EssentialsC

softdepend: []

commands:
  mysql:
    description: EssentialsC MySQL network sync management command
    usage: /mysql <status|reload|push|pull|baltop|test|version|help>
    permission: esscmysql.admin

permissions:
  esscmysql.admin:
    description: Full access to the /mysql management commands
    default: op
  esscmysql.use:
    description: Access to read-only /mysql commands (status, baltop, version, help)
    default: true
