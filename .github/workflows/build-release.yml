name: Build & Release Plugin

on:
  push:
    branches: ["maven"]

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build everything
        run: mvn -B install -DskipTests

      - name: Build main plugin
        run: mvn -B package -DskipTests -f EssC/essc/pom.xml

      - name: Build MySQL expansion
        run: mvn -B package -DskipTests -f expansions/mysqldatabaseexpansion/pom.xml

      - name: Build Profile expansion
        run: mvn -B package -DskipTests -f expansions/EssentialsCProfiles/pom.xml

      - name: Get plugin version
        id: get_version
        run: |
          VERSION=$(grep -E '^version:' EssC/essc/src/main/resources/plugin.yml \
                   | head -n1 | cut -d' ' -f2 | tr -d '"')
          echo "plugin_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected plugin version: $VERSION"

      - name: Collect JARs
        id: collect_jars
        run: |
          COMMIT_ID=${GITHUB_SHA::7}
          VERSION=${{ steps.get_version.outputs.plugin_version }}

          mkdir -p release

          MAIN_JAR=$(ls EssC/essc/target/*.jar | grep -vE "(sources|javadoc)" | head -n1)
          echo "Main JAR: $MAIN_JAR"
          cp "$MAIN_JAR" release/EssentialsC-v${VERSION}-${COMMIT_ID}.jar

          EXPANSION_JAR=$(ls expansions/mysqldatabaseexpansion/target/*.jar | grep -vE "(sources|javadoc)" | head -n1)
          echo "Expansion JAR: $EXPANSION_JAR"
          cp "$EXPANSION_JAR" release/EssentialsC-MySQL-Expansion-v${VERSION}-${COMMIT_ID}.jar

          PROFILE_JAR=$(ls expansions/EssentialsCProfiles/target/*.jar | grep -vE "(sources|javadoc)" | head -n1)
          echo "Profile JAR: $PROFILE_JAR"
          cp "$EXPANSION_JAR" release/EssentialsC-Profile-Expansion-v${VERSION}-${COMMIT_ID}.jar

          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

      - name: Upload Plugin Jars
        uses: actions/upload-artifact@v4
        with:
          name: EssentialsC
          path: release/*.jar

      - name: Create GitHub Release and Upload JARs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.plugin_version }}-${{ steps.collect_jars.outputs.commit_id }}
          name: EssentialsC v${{ steps.get_version.outputs.plugin_version }}-${{ steps.collect_jars.outputs.commit_id }}
          body: |
            Automatic release of EssentialsC

            Version: v${{ steps.get_version.outputs.plugin_version }}
            Commit: ${{ steps.collect_jars.outputs.commit_id }}

            Includes:
            - Main plugin
            - MySQL expansion
            - EssentialsC Profiles Expansion
          files: release/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
