name: Build & Release Plugin

on:
  push:
    branches: ["maven"] 

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file EssC/essc/pom.xml

      - name: Get plugin version
        id: get_version
        run: |
          VERSION=$(grep -E '^version:' EssC/essc/src/main/resources/plugin.yml \
                   | head -n1 | cut -d' ' -f2 | tr -d '"')
          echo "plugin_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected plugin version: $VERSION"

      - name: Rename jar
        run: |
          COMMIT_ID=${GITHUB_SHA::7}
          VERSION=${{ steps.get_version.outputs.plugin_version }}
          mkdir -p release

          MAIN_JAR=$(ls EssC/essc/target/*.jar | grep -vE "(sources|javadoc)" | head -n1)

          if [ -z "$MAIN_JAR" ]; then
            echo "ERROR: No JAR file found in target/!"
            exit 1
          fi

          echo "Found JAR: $MAIN_JAR"
          cp "$MAIN_JAR" release/v${VERSION}-${COMMIT_ID}.jar
          echo "Jar renamed to: release/v${VERSION}-${COMMIT_ID}.jar"

      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: EssentialsC
          path: release/*.jar
