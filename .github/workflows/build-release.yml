name: Build & Release Plugin

on:
  push:
    branches: ["maven"]

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Get plugin version
        id: get_version
        run: |
          VERSION=$(grep -E '^version:' src/main/resources/plugin.yml | head -n1 | cut -d' ' -f2 | tr -d '"')

      - name: Rename jar
        run: |
          COMMIT_ID=${GITHUB_SHA::7} # first 7 chars of commit hash
          VERSION=${{ steps.get_version.outputs.plugin_version }}
          mkdir -p release
          MAIN_JAR=$(ls target/original-*.jar | head -n1)
          cp "$MAIN_JAR" release/v${VERSION}-${COMMIT_ID}.jar
          echo "Jar renamed to v${VERSION}-${COMMIT_ID}.jar"

      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: EssentialsC
          path: release/*.jar
