debug: true

default-language: en_US

heal:
  feed-player: true
  clear-negative-effects: true

chat:
  luckperms-enabled: true

# DiscordSRV Integration Settings
discordsrv:
  enabled: true

  # Channel configuration
  # The 'name' field references a channel name defined in DiscordSRV's config.yml
  channels:
    punishments:
      name: "punishments"  # Must match a key in DiscordSRV's Channels section

  # Event-specific settings
  events:
    ban:
      enabled: true
      color: "#E74C3C"
    kick:
      enabled: true
      color: "#F39C12"
    mute:
      enabled: true
      color: "#9B59B6"
    kit:
      enabled: true
      color: "#3498DB"
    home:
      enabled: true
      color: "#2ECC71"
    home_delete:
      enabled: true
      color: "#E74C3C"

  # Avatar settings
  show-avatar: true
  avatar-url: "https://crafthead.net/helm/{uuid}"

economy:
  enabled: true
  starting-balance: "100.00"
  currency:
    singular: "Dollar"
    plural: "Dollars"
  minimum-transaction: "0.01"
  max-balance: -1

rtp:
  # Completely disable the /rtp command (will unregister from command map)
  register-command: true
  enabled: true

  # Teleport settings
  cooldown: 60 # seconds
  warmup: 5 # seconds, 0 to disable
  cancel-on-movement: true
  particles: true
  max-attempts: 10
  min-y: 64
  max-y: 128
  use-world-border: true

  # Global defaults (used if per-world not specified)
  global:
    min-radius: 1000
    max-radius: 10000
    blocked-biomes:
      - ocean
      - deep_ocean
      - river

  # Per-world settings
  worlds:
    world:
      enabled: true
      min-radius: 1000
      max-radius: 10000
      blocked-biomes: []
    world_nether:
      enabled: true
      min-radius: 500
      max-radius: 5000
      blocked-biomes: []
    world_the_end:
      enabled: true
      min-radius: 1000
      max-radius: 8000
      blocked-biomes: []

teleport:
  tpa:
    cooldown: 60
    warmup: 3
    timeout: 60
    max-pending: 5
    max-outgoing: 1
    cost: 0.0
    deny-movement: true
    particles: true
    sounds: true
    blocked-worlds: []

home:
  max-homes: 3
  default-name: "home"
  cooldown: 5
  warmup: 3
  cancel-on-movement: true
  particles: true
  sounds: true
  blocked-worlds:
    - "world_nether"
    - "world_the_end"

spawn:
  cooldown: 5
  warmup: 3
  teleport-on-first-join: true
  particles: true
  sounds: true
  cancel-on-movement: true

join-leave-messages:
  enabled: true
  join: "<white><player> <#FFCE00>joined the game"
  leave: "<white><player> <#FF4000>left the game"

back:
  warmup: 3
  cooldown: 5
  particles: true
  sounds: true
  cancel-on-movement: true

scoreboard:
  enabled: true
  update-interval: 20
  title: "<#279FF5><b>ꜱᴇʀᴠᴇʀɴᴀᴍᴇ"
  lines:
    - ""
    - "<#279FF5><b>%player_name%:<reset>"
    - "<#279FF5><b>|<reset> <#9CD6FF>ʀᴀɴᴋ: <white>%luckperms_prefix%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ʙᴀʟᴀɴᴄᴇ: <white>%vault_eco_balance_formatted%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ᴋɪʟʟѕ: <white>%statistic_player_kills%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ᴅᴇᴀᴛʜѕ: <white>%statistic_deaths%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ʟᴀᴛᴇɴᴄʏ: <white>%player_ping%<#9CD6FF>ᴍꜱ"
    - ""
    - "<#279FF5><b>|<reset> <#9CD6FF>ᴏɴʟɪɴᴇ: <white>%server_online%<gray>/<white>%server_max_players%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ᴛᴘꜱ: <white>%server_tps_1%"
    - "<#279FF5><b>|<reset> <#9CD6FF>ᴠᴇʀꜱɪᴏɴ: <white>%server_version%"



rename:
  blacklist-enabled: true
  blacklist-words:
    - "badword"
    - "hello"
  max-length: 50
  min-length: 1
  normalize-enabled: true
  strip-colors-for-check: true

vanish:
  hide-from-tab: true
  give-night-vision: true
  prevent-mob-target: true
  disable-collisions: true

nickname:
  enabled: true
  min-length: 3
  max-length: 16
  allow-colors: true
  allow-formats: true
  blacklist-enabled: true
  blacklist-words: []
  normalize-enabled: true
  unique: true
  update-tab: true

shop:
  enabled: true
  main-menu-title: "<#F52727><b>Server Shop"
  main-menu-size: 54
  category-title: "<#F52727><category>"
  category-menu-title: "<#F52727>Shop - <category>"
  close-button-enabled: true
  items-per-page: 28
  fill-empty-slots: true
  fill-material: "BLACK_STAINED_GLASS_PANE"
  log-transactions: true
  currency:
    singular: "Dollar"
    plural: "Dollars"

hat:
  blacklist-enabled: true
  blacklist-items:
    - bedrock
    - barrier
    - command_block
    - structure_void
    - jigsaw
    - light
  allow-blocks: false # "blocks" = blacklisted-items
  require-lore: false
  require-custom-name: false

auction-house:
  enabled: true
  max-auctions-per-player: 5
  duration-hours: 48
  min-price: "1.00"
  max-price: "-1"  # -1 for unlimited

warp:
  enabled: true
  cooldown: 5
  warmup: 3
  cancel-on-movement: true
  particles: true
  sounds: true
  blocked-worlds:
    - world_nether
    - world_the_end
  group-by-category: true
  max-name-length: 16
  limit-per-player:
    enabled: false
    max: 5

afk:
  enabled: true

  timeout-seconds: 300

  kick-timeout-seconds: 1800

  tab-placeholder-enabled: true
  tab-placeholder: "<color:#FF6B6B>[AFK]</color> "

  broadcast-enabled: true

  title-enabled: true
  title: "<color:#FF6B6B>You are now AFK</color>"
  subtitle: "<color:#FFE66D>Move to return</color>"

  prevent-damage: true
  prevent-mob-target: true
  prevent-pickup: true

  freeze-player: true

  blocked-commands:
    - spawn
    - home
    - tpa
    - tpahere
    - warp
    - shop

  list-show-location: true
  list-show-world: true
  list-sort-by: "time"  # Options: time, name, world
